<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#12365A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traza Casa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Traza Casa</title>
<style>
:root{
  --bg:#FFFFFF; --soft:#F6F8FB; --card:#F6F8FB; --ink:#12365A; --muted:#62748B; --line:#E7EBF1; --line2:#D3DBE6;
  --azul:#1A4772; --azul-d:#12365A; --azul-l:#EAF0F7; --azul-b:#C9D6E6;
  --oro:#BE900E; --oro-t:#7D5C06; --oro-l:#FAF3DC; --oro-b:#E3CF8E;
  --cielo:#2F6AA0; --cielo-l:#E4EEF8;
  --lav:#5B6B82; --lav-l:#EBEFF4;
  --verde:#2E7D4F; --verde-l:#E3F2E9;
  --rojo:#B3261E; --rojo-l:#FBE6E4;
  --r:20px;
  --serif:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font:19px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.2}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* Encabezado */
header.top{background:#fff;color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 20px 14px;position:relative;border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:max(20px,calc((100% - 760px)/2));bottom:-1px;width:44px;height:2px;background:var(--oro)}
.hrow{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto}
.logo{width:44px;height:44px;flex:none}
.logo svg{width:44px;height:44px;stroke:none}
.logo svg rect{stroke:var(--line2);stroke-width:1.2}
.htxt{flex:1;min-width:0}
.brand{font-size:15px;color:var(--azul);font-weight:600;letter-spacing:.01em}
.hello{font-family:var(--serif);font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.clock{font-size:15px;color:var(--muted)}
.gear{background:transparent;border:0;color:var(--muted);border-radius:50%;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center}
.gear:active{background:var(--soft)}

/* Estado */
.status{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);margin:0 0 16px;padding:12px 16px;background:var(--soft);border-radius:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--verde);flex:none}
.dot.warn{background:var(--oro)} .dot.bad{background:var(--rojo)} .dot.off{background:#9AA7BA}
.status button{margin-left:auto}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 32px}
.in{max-width:760px;margin:0 auto}
section{margin-bottom:32px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.sh h2{font-family:var(--serif);font-size:25px;font-weight:600}
.sh .cnt{font-size:16px;color:var(--muted);font-weight:500}
.card{background:var(--soft);border:0;border-radius:var(--r);padding:20px;box-shadow:none}
.muted{color:var(--muted)}
.small{font-size:16px}

/* Botones: planos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border-radius:999px;background:#fff;border:1.5px solid var(--line2);box-shadow:none;color:var(--azul-d);font-weight:600;text-decoration:none;transition:background .12s,transform .08s}
.btn:active{background:var(--azul-l);transform:scale(.98)}
.btn.pri,.btn.wa{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn.pri:active,.btn.wa:active{background:var(--azul-d)}
.btn.danger{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn.gold{background:var(--oro-l);color:var(--oro-t);border-color:var(--oro-b)}
.btn.sm{min-height:46px;padding:6px 18px;font-size:17px}
.btn.full{width:100%}
.btn.big{min-height:62px;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

/* Tu día */
.daytop{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.prog{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--azul);border-radius:4px}
.item{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px}
.ic.done{background:var(--verde-l);color:var(--verde)}
.ic.wait{background:var(--oro-l);color:var(--oro-t)}
.ic.late{background:var(--rojo-l);color:var(--rojo)}
.it{flex:1;min-width:0}
.it b{display:block;font-size:19px;font-weight:600}
.it span{display:block;font-size:16px;color:var(--muted)}
.item .btn{flex:none;min-height:46px;padding:6px 16px;font-size:17px}
.item .btn svg{width:20px;height:20px}
.item{align-items:flex-start}
@media (max-width:420px){.item .it b{font-size:18px}.item .btn.wa{padding:6px 14px}}
.done-t b{color:var(--muted);font-weight:500}

/* Acciones */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:18px;min-height:128px;padding:18px;border-radius:var(--r);background:var(--soft);border:0;box-shadow:none;text-align:left;font-size:19px;font-weight:600;color:var(--ink);transition:background .12s,transform .08s}
.act:active{background:var(--azul-l);transform:scale(.98)}
.act .ic{width:46px;height:46px;background:#fff;color:var(--azul);box-shadow:inset 0 0 0 1px var(--line)}
.act .ic svg{width:24px;height:24px}
.act small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:2px}

/* Listas */
.li{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.li:first-child{border-top:0}
.li .amt{font-weight:600;white-space:nowrap}
.s-luz{background:var(--oro-l);color:var(--oro-t)}
.s-agua{background:var(--cielo-l);color:var(--cielo)}
.s-gas{background:var(--lav-l);color:var(--lav)}
.s-internet{background:#E3F2EF;color:#1F6F63}
.s-mant{background:var(--oro-l);color:var(--oro-t)}
.s-inv{background:var(--azul-l);color:var(--azul)}
.s-pago{background:var(--verde-l);color:var(--verde)}
.s-inq{background:var(--azul-l);color:var(--azul)}
.s-aviso{background:var(--oro-l);color:var(--oro-t)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--verde-l);color:var(--verde)}
.chip.warn{background:var(--oro-l);color:var(--oro-t)}
.chip.bad{background:var(--rojo-l);color:var(--rojo)}
.chip.info{background:var(--azul-l);color:var(--azul)}
.chip.off{background:#EEF1F5;color:var(--muted)}

/* Propiedades */
.pcard{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:var(--r);padding:20px;margin-bottom:12px;box-shadow:none;transition:background .12s,transform .08s}
.pcard:active{background:var(--azul-l);transform:scale(.99)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ptype{font-size:15px;font-weight:500;color:var(--muted)}
.pn{font-family:var(--serif);font-size:23px;font-weight:600}
.pt{color:var(--muted);font-size:17px;margin-top:2px}
.ps{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* Filtros */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px}
.filters .btn{flex:none;min-height:44px;font-size:17px;padding:6px 18px}
.filters .btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}

/* Resumen */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.mnav b{font-family:var(--serif);font-size:24px;font-weight:600;text-transform:capitalize}
.kpi{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.kl{font-size:16px;font-weight:500;color:var(--muted)}
.phrase{font-size:18px;margin-top:6px}
.grid2{display:grid;gap:14px}
.chg{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
.chg:first-child{border-top:0}
.up{color:var(--rojo)} .down{color:var(--verde)}
.note{background:#fff;border-left:3px solid var(--oro);padding:10px 14px;border-radius:4px 12px 12px 4px;font-size:16px;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--azul);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line2)}
th{font-weight:500;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}

/* Navegación */
nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:none}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;background:none;border:0;font-size:15px;font-weight:500;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--azul);font-weight:600}
nav.tabs button.on::before{content:"";position:absolute;top:-1px;left:34%;right:34%;height:2px;background:var(--oro)}

/* Ventanas */
.wrap{position:fixed;inset:0;background:rgba(18,54,90,.38);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-height:92dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:12px 20px calc(26px + env(safe-area-inset-bottom));animation:up .22s ease-out;border:0}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}.btn,.act,.pcard{transition:none}}
.shead{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.q{font-family:var(--serif);font-size:28px;font-weight:600;margin:6px 2px 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 18px;background:var(--soft);border:0;border-radius:18px;box-shadow:none;text-align:left;font-size:20px;font-weight:600;transition:background .12s,transform .08s}
.opt:active{background:var(--azul-l);transform:scale(.99)}
.opt .it span{font-weight:400}
label.f{display:block;font-weight:600;margin:16px 2px 6px}
.inp{width:100%;min-width:0;font:inherit;font-size:20px;padding:14px 16px;border:1.5px solid var(--line2);border-radius:16px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea.inp{min-height:110px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--azul) 50%),linear-gradient(135deg,var(--azul) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 15px) 52%;background-size:7px 7px;background-repeat:no-repeat;padding-right:40px}
.inp:focus{outline:2px solid var(--azul);outline-offset:1px;border-color:var(--azul)}
.money{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:0 18px}
.money span{font-size:32px;font-weight:500;color:var(--muted)}
.money input{border:0;outline:0;font:inherit;font-size:40px;font-weight:500;width:100%;min-width:0;padding:12px 8px;background:none;color:var(--ink);font-variant-numeric:tabular-nums}
.money:focus-within{outline:2px solid var(--azul);outline-offset:1px;border-color:var(--azul)}
.hint{font-size:16px;color:var(--muted);margin:8px 2px 0}
.err{color:var(--rojo);font-size:16px;font-weight:600;margin:8px 2px 0}
.ctx{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 2px 14px}
.more{margin-top:16px}
.more summary{display:inline-flex}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:120px}
.seg .btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
.box{background:var(--soft);border:0;border-radius:18px;padding:18px;margin-bottom:14px}
.box h3{font-size:19px;font-weight:600;margin-bottom:6px}
.sep{height:14px}
.waprev{background:var(--azul-l);border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:17px;white-space:pre-wrap;margin:8px 0 12px;border:0}

/* Aviso de guardado */
.toast{position:fixed;left:20px;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--azul-d);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 10px 30px rgba(18,54,90,.28);animation:up .2s ease-out}
.toast .ic{background:var(--oro);color:#fff;width:42px;height:42px}
.toast .ic svg{width:24px;height:24px;stroke-width:2.6}
.toast b{flex:1;font-size:18px;font-weight:600}
.toast .btn{min-height:44px;background:#fff;color:var(--azul-d);border-color:#fff;box-shadow:none}
.toast.bad .ic{background:#fff;color:var(--rojo)}

.empty{text-align:center;padding:30px 16px}
.empty .ic{margin:0 auto 12px;width:60px;height:60px;background:var(--azul-l);color:var(--azul)}
.empty .ic svg{width:30px;height:30px}
.demo{background:var(--oro-l);color:var(--oro-t);border:0;font-weight:600;font-size:14px;text-align:center;padding:5px 10px}

@media (max-width:370px){.two{grid-template-columns:1fr}.acts{gap:10px}.act{font-size:18px}}
@media (min-width:760px){
  .wrap{align-items:center;justify-content:center}
  .sheet{max-width:600px;border-radius:28px}
  .acts{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plist .pcard{margin:0}
  nav.tabs{justify-content:center}nav.tabs button{max-width:190px}
}

/* Ajustes de calma */
main .card:has(>.item),main .card:has(>.daytop){background:none;padding:0}
.clock{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .btn.wa svg{display:none}
.item .it span{line-height:1.35}

/* Mantenimientos e inventario */
.acts .act:last-child:nth-child(odd){grid-column:1/-1}
.chk{padding:14px 0;border-top:1px solid var(--line)}
.chk b{display:block;font-size:19px;margin-bottom:2px}
.chk .seg{margin-top:8px}.chk .seg .btn{min-width:0;flex:1}
.seg .btn.on.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.seg .btn.on.bad{background:var(--rojo);border-color:var(--rojo);color:#fff}
.seg .btn.on.warn{background:var(--oro);border-color:var(--oro);color:#fff}
.qk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.qk .btn{min-height:40px;font-size:16px;padding:4px 14px}
.tn{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.tn .it{flex:1;min-width:0}.tn .it span{display:block;color:var(--muted);font-size:16px}
@media (min-width:700px){.acts .act:last-child:nth-child(odd){grid-column:auto}}
/* Guía de pasos y ajustes de flujo */
#sheet:not([hidden])~#toastBox .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top));z-index:60}
.seg.sv{display:grid;grid-template-columns:1fr 1fr}.seg.sv .btn{min-width:0}
.next{display:flex;gap:12px;align-items:flex-start;background:var(--oro-l);color:var(--oro-t);border-radius:16px;padding:14px 16px;margin:2px 0 14px;font-size:18px;font-weight:600}
.next .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--oro);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.next.okk{background:var(--verde-l);color:var(--verde)}.next.okk .n{background:var(--verde)}
.chk.miss{border-left:4px solid var(--rojo);padding-left:12px}
/* Inicio compacto y filtros */
.dia{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:var(--soft);border:0;border-radius:var(--r);text-align:left;transition:background .12s,transform .08s}
.dia:active{background:var(--azul-l);transform:scale(.99)}
.dia .ic{background:#fff;color:var(--azul);box-shadow:inset 0 0 0 1px var(--line)}
.dia .ic.done{background:var(--verde-l);color:var(--verde);box-shadow:none}
.dia .it b{font-family:var(--serif);font-size:22px;font-weight:600}
.badge{min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:var(--rojo);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.chev{color:var(--muted);display:flex;transform:scaleX(-1)}
.acts{gap:10px}
.act{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;min-height:68px;padding:12px 14px;font-size:17px}
.act .ic{width:40px;height:40px}
.act .ic svg{width:22px;height:22px}
.fbox{margin:0 0 12px}
.fbox>summary{display:inline-flex;gap:8px;list-style:none;cursor:pointer}
.fbox>summary::-webkit-details-marker{display:none}
.fbox .box{margin-top:10px}
/* Acentos de color por tipo de acción (menos azul) */
:root{--teal:#0F766E;--teal-l:#E0F2EF;--coral:#C2410C;--coral-l:#FDEADF;--viol:#6D4AA8;--viol-l:#EFE9F8;--wa:#1F8A4C;--wa-d:#17703D}
.act.a-gasto{background:var(--oro-l)}.act.a-gasto .ic{background:#fff;color:var(--oro-t);box-shadow:inset 0 0 0 1px var(--oro-b)}
.act.a-pago{background:var(--verde-l)}.act.a-pago .ic{background:#fff;color:var(--verde);box-shadow:inset 0 0 0 1px #BFE0CB}
.act.a-alta{background:var(--teal-l)}.act.a-alta .ic{background:#fff;color:var(--teal);box-shadow:inset 0 0 0 1px #B5DCD6}
.act.a-baja{background:var(--viol-l)}.act.a-baja .ic{background:#fff;color:var(--viol);box-shadow:inset 0 0 0 1px #D6C9EC}
.act.a-mant{background:var(--coral-l)}.act.a-mant .ic{background:#fff;color:var(--coral);box-shadow:inset 0 0 0 1px #F3C9B1}
.act:active{filter:brightness(.97)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}.btn.wa:active{background:var(--wa-d)}
.item .btn[data-a="gasto"]{background:var(--oro-l);border-color:var(--oro-b);color:var(--oro-t)}
.item .btn[data-a="pago"],.item .btn[data-a="pred-pag"]{background:var(--verde-l);border-color:#BFE0CB;color:var(--verde)}

<script>

  prev:'Buenos días {nombre}, aprovecho para comentarte que el recibo de la renta ya se encuentra disponible a partir de {cuando}. Quedo al pendiente para que me indiquen si prefieren que pase por la renta en efectivo o si desean enviarme un retiro sin tarjeta. ¡Gracias!',

};

function diaHabilAntes(f){let x=addDays(f,-1);while([0,6].includes(new Date(x+'T12:00:00Z').getUTCDay()))x=addDays(x,-1);return x}

/* ---------- Íconos ---------- */
const P={

  userMinus:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M16 11h6"/>',
  home:'<path d="M3 11 12 3l9 8M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

};
const I=new Proxy({},{get:(_,k)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(P[k]||'')+'</svg>'});

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){const a='abcdefghijklmnopqrstuvwxyz0123456789';let r='';const b=new Uint8Array(5);crypto.getRandomValues(b);for(const x of b)r+=a[x%36];return Date.now().toString(36)+r}
const fmtD=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const fmtH=new Intl.DateTimeFormat('es-MX',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtHr=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hour12:false});
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
function money(n){return MXN.format(Math.round(Number(n)||0))}
function today(){return fmtD.format(new Date())}
function curMonth(){return today().slice(0,7)}
function addMonths(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+String(mo).padStart(2,'0')}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function dueDate(mes,dia){const[y,m]=mes.split('-').map(Number);return mes+'-'+String(Math.min(dia,dim(y,m))).padStart(2,'0')}
function dayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)}
function fechaLarga(d){if(!d)return'';const[y,m,dd]=d.split('-').map(Number);return dd+' de '+MESES[m-1]}
function mesLargo(m){const[y,mo]=m.split('-').map(Number);return MESES[mo-1]+' '+y}
function mesCorto(m){return MESES[Number(m.slice(5))-1].slice(0,3)}
function median(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0}
function num(v){const n=Number(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:NaN}
function telWa(t){let d=String(t||'').replace(/\D/g,'');if(d.length===10)return'52'+d;if(d.length===13&&d.startsWith('521'))return'52'+d.slice(3);if(d.length===12&&d.startsWith('52'))return d;return null}
function okUrl(u){return typeof u==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(u)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}
function dd(n){return n+' día'+(n===1?'':'s')}
function fechaCompleta(f){return f?fechaLarga(f)+' de '+f.slice(0,4):''}
function addMesesFecha(f,n){const[y,m,d]=f.split('-').map(Number);const t=y*12+(m-1)+n;const yy=Math.floor(t/12),mm=t%12+1;return yy+'-'+String(mm).padStart(2,'0')+'-'+String(Math.min(d,dim(yy,mm))).padStart(2,'0')}
function addDays(f,n){return new Date(Date.parse(f+'T00:00:00Z')+n*864e5).toISOString().slice(0,10)}
function addYear(f){const[y,m,d]=f.split('-');return (Number(y)+1)+'-'+m+'-'+(m==='02'&&d==='29'?'28':d)}
function chipContrato(t){if(!t||!t.fechaFin)return'';const d=dayDiff(today(),t.fechaFin);if(d<0)return'<span class="chip bad">Contrato vencido</span>';if(d<=60)return`<span class="chip warn">Contrato vence en ${dd(d)}</span>`;return`<span class="chip off">Contrato hasta el ${fechaLarga(t.fechaFin)}</span>`}
function chipPredial(r){if(!r||!r.predialFecha)return'';const d=dayDiff(today(),r.predialFecha);if(d<0)return'<span class="chip bad">Predial vencido</span>';if(d<=30)return`<span class="chip warn">Predial vence en ${dd(d)}</span>`;return`<span class="chip off">Predial: ${fechaLarga(r.predialFecha)}</span>`}
function predioDe(p){return p&&p.predioId?get('predios',p.predioId):null}

/* ---------- Estado ---------- */
function blank(){const d={};for(const c in COLS)d[c]={};return{v:1,data:d,pend:[],conn:null,device:null,deviceName:'',rol:null,config:null,configDirty:0,lastSync:0,status:'none',err:null}}
function load(){
  if(DEMO)return demoState();
  try{const j=JSON.parse(ls(LSK));if(j&&j.v===1){const b=blank();Object.assign(b,j);b.data=Object.assign(blank().data,j.data||{});return b}}catch(e){}
  return blank();
}
function save(){if(!DEMO){ls(LSK,JSON.stringify(S));pushConn()}}
/* Avisos al teléfono: el service worker necesita la conexión para pedir el texto del aviso */
let _pc='';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('tc',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function pushConn(){try{const v=S.conn&&S.device&&(S.rol==='propietario'||S.rol==='capturista')?JSON.stringify({u:S.conn.u,k:S.conn.k,device:S.device,deviceName:S.deviceName||''}):'';if(v===_pc)return;_pc=v;
  idbOpen().then(d=>{const st=d.transaction('k','readwrite').objectStore('k');if(v)st.put(JSON.parse(v),'conn');else st.delete('conn')}).catch(()=>{})}catch(e){}}
const b64u={enc:a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const r=atob(s+'==='.slice((s.length+3)%4));return Uint8Array.from(r,c=>c.charCodeAt(0))}};
async function llamar(action,extra){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),30000);
  try{const res=await fetch(S.conn.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:S.conn.k,device:S.device,deviceName:S.deviceName||'Sin nombre'},extra||{})),signal:ctl.signal,redirect:'follow',credentials:'omit'});return await res.json()}finally{clearTimeout(to)}
}
const iosSinApp=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!(navigator.standalone||matchMedia('(display-mode: standalone)').matches);
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function pushEstado(){
  const box=document.getElementById('pushBox');if(!box)return;
  let h='';
  if(!pushOk()){h=iosSinApp()?'<p class="muted small">En iPhone primero agrega la app a tu pantalla de inicio: toca Compartir y luego «Agregar a pantalla de inicio». Ábrela desde ahí y vuelve aquí.</p>':'<p class="muted small">Este teléfono o navegador no permite avisos. Prueba abrir la app desde Chrome (Android) o desde la pantalla de inicio (iPhone).</p>'}
  else if(Notification.permission==='denied'){h='<p class="muted small">Los avisos están bloqueados para esta app. Actívalos en los ajustes del teléfono (Notificaciones → Traza Casa) y vuelve aquí.</p>'}
  else{let sub=null;try{const reg=await navigator.serviceWorker.ready;sub=await reg.pushManager.getSubscription()}catch(e){}
    h=sub?`<p class="muted small">Activados en este teléfono. ${isOwner()?'Te avisa por la mañana si hay rentas por recordar, mantenimientos o predial cercano.':'Te avisa por la mañana si hay mantenimientos para hoy o mañana.'}</p><div class="row"><button class="btn" data-a="push-test">${I.chat} Mandar una prueba</button><button class="btn" data-a="push-off" style="color:var(--rojo)">Desactivar</button></div>`:`<p class="muted small">Recibe un aviso en este teléfono cuando haya algo por hacer, aunque la app esté cerrada.</p><button class="btn pri full" data-a="push-on">${I.chat} Activar avisos</button>`}
  const b2=document.getElementById('pushBox');if(b2)b2.innerHTML=h;
}
let S=load();
if(!S.device){const a=new Uint8Array(12);crypto.getRandomValues(a);S.device=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');save()}

function list(c){return Object.values(S.data[c]||{}).filter(r=>!Number(r.eliminado))}
function get(c,id){const r=S.data[c][id];return r&&!Number(r.eliminado)?r:null}
function prop(id){return get('propiedades',id)}
function activos(){return list('inquilinos').filter(t=>t.estado==='activo'&&prop(t.propiedadId))}
function inqDe(pid){return list('inquilinos').find(t=>t.propiedadId===pid&&t.estado==='activo')}
/* Servicios incluidos en la renta (los paga el edificio o la casa): no se registran recibos por departamento */
function incl(p){const d=p&&p.predioId?get('predios',p.predioId):null;return[...new Set([String((p&&p.incluidos)||'').split(','),String((d&&d.incluidos)||'').split(',')].flat().filter(x=>SERV[x]))]}
function hasServ(p,s){return String(p.servicios||'luz,agua,gas').split(',').includes(s)&&!incl(p).includes(s)}
/* Recibos: cada cuánto llega (meses). 0 = cuando se acaba (gas) */
const FREQ={luz:2,agua:1,gas:0,internet:1};
const FREQ_TXT={luz:'cada 2 meses',agua:'cada mes',gas:'cuando se acaba',internet:'cada mes'};
/* A quién se le registra el recibo: al depa si lo paga el inquilino; al edificio o casa si va incluido en la renta */
function isTarget(p,s){return hasServ(p,s)||(!(p.predioId&&get('predios',p.predioId))&&incl(p).includes(s))}
function recTargets(s){const o=[];list('propiedades').forEach(p=>{if(isTarget(p,s))o.push({id:p.id,nombre:p.nombre})});list('predios').forEach(d=>{if(incl(d).includes(s))o.push({id:d.id,nombre:d.nombre+' (edificio)'})});return o}
function recName(id){const x=get('propiedades',id)||get('predios',id);return x?x.nombre:''}
function ventana(M,s){const f=FREQ[s]||1;return Array.from({length:f},(_,i)=>addMonths(M,-i))}
function recCubierto(id,s,M){const v=ventana(M,s);return list('gastos').some(g=>g.propiedadId===id&&g.servicio===s&&v.includes(g.mes))}
function chipIncl(x){const a=incl(x);return a.length?`<span class="chip ok">Incluye ${a.map(s=>SERV[s].n.toLowerCase()).join(', ')}</span>`:''}
function isOwner(){return DEMO||!S.conn||S.rol==='propietario'}
/* El capturista puede todo salvo mandar mensajes de dinero de renta */
function canWA(){return isOwner()}  /* solo mensajes de dinero de renta (recordatorio y recibo) */
function canEdit(c,r){return true}
function cfg(){const c=S.config||{};return{negocio:c.negocio||'',propietario:c.propietario||'',telPropietario:c.telPropietario||'',plantillas:Object.assign({},DEF_PLANT,c.plantillas||{}),v:c.v||1,updatedAt:c.updatedAt||0}}
function propsOrd(){return list('propiedades').sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true}))}

/* ---------- Renta: cuándo toca y qué aviso sigue ---------- */
function estadoRenta(t){
  const hoy=today(),M=curMonth(),dia=Number(t.diaPago)||1,ini=t.fechaInicio||hoy;
  const pag=new Set(list('pagos').filter(p=>p.inquilinoId===t.id).map(p=>p.mes));
  let m=addMonths(M,-2);if(m<ini.slice(0,7))m=ini.slice(0,7);
  for(let i=0;i<8;i++,m=addMonths(m,1)){
    const due=dueDate(m,dia);if(due<ini||pag.has(m))continue;
    const dias=dayDiff(hoy,due);
    const rem=diaHabilAntes(due);
    const etapa=(hoy>=rem&&dias>=0)?'prev':null;
    return{mes:m,due,dias,etapa,rem};
  }
  return null;
}
function avisoDe(t,st){return list('avisos').find(a=>a.inquilinoId===t.id&&a.mes===st.mes&&a.etapa===st.etapa)}
function chipRenta(st){
  if(!st)return'<span class="chip ok">Al corriente</span>';
  if(st.dias<0)return`<span class="chip bad">Atrasado ${-st.dias} día${st.dias===-1?'':'s'}</span>`;
  if(st.dias===0)return'<span class="chip bad">Vence hoy</span>';
  if(st.dias<=15)return`<span class="chip warn">Vence en ${st.dias} día${st.dias===1?'':'s'}</span>`;
  return`<span class="chip ok">Próximo pago: ${fechaLarga(st.due)}</span>`;
}
function mensaje(t,st,etapa){
  const p=prop(t.propiedadId)||{},c=cfg();
  const tpl=c.plantillas[etapa==='prev'?'prev':'gen'];
  const v={nombre:firstName(t.nombre),mes:st?MESES[Number(st.mes.slice(5))-1]:'',propiedad:p.nombre||'',monto:money(t.renta),fecha:st?fechaLarga(st.due):'',dias:st?Math.abs(st.dias):'',cuando:st?cuandoRenta(st.due,st.dias):'',propietario:c.propietario||S.deviceName||''};
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
}

const RES={ok:['Está','ok'],dano:['Dañado','warn'],falta:['Falta','bad']};
const QK=['TV','Cama','Base de cama','Colchón','Closet','Refrigerador','Estufa','Mesa','Sillas','Sillón','Lavadora','Minisplit','Cortinas'];
function propietarioNombre(){const c=cfg();return c.propietario||S.deviceName||''}
function plant(k,v){return cfg().plantillas[k].replace(/\{(\w+)\}/g,(m,x)=>x in v?v[x]:m)}
function waUrl(tel,txt){return'https://wa.me/'+(tel||'')+'?text='+encodeURIComponent(txt)}
function lista(a){a=a.map(x=>x.toLowerCase());return a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:a.join('')}
/* Número a letras (pesos) para el recibo */
const U20=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const DEC=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CEN=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function letras(n,apoc){
  if(n<30){let w=U20[n];if(apoc){if(n===1)w='un';else if(n===21)w='veintiún'}return w}
  if(n<100){const d=Math.floor(n/10),u=n%10;return DEC[d]+(u?' y '+letras(u,apoc):'')}
  if(n<1000){if(n===100)return'cien';return CEN[Math.floor(n/100)]+(n%100?' '+letras(n%100,apoc):'')}
  if(n<1e6){const k=Math.floor(n/1000),r=n%1000;return (k===1?'mil':letras(k,true)+' mil')+(r?' '+letras(r,apoc):'')}
  const m=Math.floor(n/1e6),r=n%1e6;return (m===1?'un millón':letras(m,true)+' millones')+(r?' '+letras(r,apoc):' de')
}
function pesosLetra(x){const c=Math.round((Number(x)||0)*100),e=Math.floor(c/100),cc=c%100;return (e===1?'un peso ':letras(e)+' pesos ')+String(cc).padStart(2,'0')+'/100 m.n.'}
function fechaAnio(d){if(!d)return'';const[y,m,dd]=d.split('-').map(Number);return dd+' de '+MESES[m-1]+' del '+y}
function mensajePago(t,pg){
  const p=prop(t.propiedadId)||{},pr=predioDe(p)||{};
  const dir=p.direccion||pr.direccion||'';
  const inm=[dir,p.interior?(p.tipo||'Departamento')+' '+p.interior:''].filter(Boolean).join(', ')||(p.nombre||'');
  const dia=Number(t.diaPago)||1;
  const monto=Number(pg.monto)||0;
  const U=x=>String(x||'').toUpperCase();
  return plant('recibo',{nombre:firstName(t.nombre),mes:MESES[Number(String(pg.mes).slice(5))-1]||'',propiedad:U(p.nombre),monto:money(pg.monto),
    montodec:'$ '+monto.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),letra:pesosLetra(monto),
    fechapago:U(fechaAnio(pg.fecha||today())),desde:U(fechaAnio(dueDate(pg.mes,dia))),hasta:U(fechaAnio(dueDate(addMonths(pg.mes,1),dia))),
    inquilino:U(t.nombre),inmueble:U(inm),propietario:U(propietarioNombre())})}
function enviarPagoWA(pg){if(!canWA())return;const t=get('inquilinos',pg.inquilinoId);if(!t)return;const tel=telWa(t.telefono);if(!tel){toast('Falta el WhatsApp de '+firstName(t.nombre)+'. Agrégalo en Propiedades.',null,true);return}window.open(waUrl(tel,mensajePago(t,pg)),'_blank','noopener')}
const mDest=m=>{const d=String(m.destino||'');return{k:d.slice(0,1),id:d.slice(2)}};
function mantProps(m){const{k,id}=mDest(m);return k==='e'?list('propiedades').filter(p=>p.predioId===id):[prop(id)].filter(Boolean)}
function mantBase(m){const{k,id}=mDest(m);return k==='e'?((get('predios',id)||S.data.predios[id]||{}).nombre||'Edificio'):((prop(id)||S.data.propiedades[id]||{}).nombre||'Propiedad')}
function mantNombre(m){return mDest(m).k==='e'?mantBase(m)+' (todo el edificio)':mantBase(m)}
function mantInq(m){return mantProps(m).map(p=>inqDe(p.id)).filter(Boolean)}
function mantSv(m){return String(m.servicios||'').split(',').filter(x=>SERV[x])}
function mantMes(mes){const a=list('mantenimientos').filter(m=>String(m.fecha).slice(0,7)===mes);return{n:a.length,total:a.reduce((x,m)=>x+(+m.costo||0),0)}}
function mensajeMant(t,m,fin){
  const sv=mantSv(m).map(x=>SERV[x].n),f=m.fecha;
  const cuando=(f===today()?'hoy':f===addDays(today(),1)?'mañana':'el '+fechaLarga(f))+(m.horario?', '+m.horario:'');
  return plant(fin?'mantfin':'mant',{nombre:firstName(t.nombre),propietario:propietarioNombre(),propiedad:mantBase(m),motivo:m.motivo,cuando,corte:sv.length?'Durante ese tiempo no habrá '+lista(sv)+'. ':'',restab:sv.length?'Ya quedó restablecido: '+lista(sv)+'. ':''});
}
function mensajeInv(i){const c=cfg(),p=prop(i.propiedadId)||{};return'Hola'+(c.propietario?' '+c.propietario:'')+', te aviso que se retirará "'+i.nombre+'" de '+(p.nombre||'la propiedad')+(i.motivoRetiro?' ('+i.motivoRetiro+')':'')+'.'+(S.deviceName?' — '+S.deviceName:'')}
function invDe(pid,est){return list('inventario').filter(i=>i.propiedadId===pid&&(!est||i.estado===est)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}
function resItems(str){return String(str||'').split('|').filter(Boolean).map(x=>{const i=x.lastIndexOf('=');const v=RES[x.slice(i+1)]||RES.ok;return`<div class="tn"><span class="it"><b>${esc(x.slice(0,i))}</b></span><span class="chip ${v[1]}">${v[0]}</span></div>`}).join('')}
function chkRows(inv){F.chk=F.chk||{};return inv.map(i=>`<div class="chk"><b>${esc(i.nombre)}</b>${i.descripcion?`<span class="muted small">${esc(i.descripcion)}</span>`:''}<div class="seg">${['ok','dano','falta'].map(v=>`<button class="btn sm${F.chk[i.id]===v?' on '+RES[v][1]:''}" data-a="b-chk" data-id="${i.id}" data-v="${v}">${RES[v][0]}</button>`).join('')}</div></div>`).join('')+`<label class="f" for="fnota">Observaciones (opcional)</label><input class="inp" id="fnota" maxlength="200" value="${esc(F.cnota||'')}"><div class="err" id="ferr" hidden></div>`}
function chkProg(inv){F.chk=F.chk||{};return`<span class="chip info" id="chkprog">${inv.filter(i=>F.chk[i.id]).length} de ${inv.length} revisados</span>`}
function chkRevisar(old,inv,fecha){const ch=F.chk||{};
  if(inv.some(i=>!ch[i.id])){const rows=[...document.querySelectorAll('.chk')];let first=null;inv.forEach((i,k)=>{if(!ch[i.id]&&rows[k]){rows[k].classList.add('miss');first=first||rows[k]}});if(first)first.scrollIntoView({block:'center',behavior:'smooth'});return{err:'Faltan artículos por revisar (marcados en rojo).'}}
  return{bad:inv.filter(i=>ch[i.id]!=='ok').length,op:{c:'revisiones',r:{id:uid(),inquilinoId:old.id,propiedadId:old.propiedadId,fecha,resultado:inv.map(i=>i.nombre.replace(/[=|]/g,' ')+'='+ch[i.id]).join('|').slice(0,1500),nota:val('fnota')}}}}
function volverProp(pid){F={flow:'pdet',hist:[]};pdet(pid)}
function redet(){const el=$('#sheet .sheet');const sc=el?el.scrollTop:0;FLOWS.mant.det();const e2=$('#sheet .sheet');if(e2)e2.scrollTop=sc}
function msvSeg(){return`<div class="seg sv">${Object.keys(SERV).map(s=>`<button class="btn sm${F.msv.includes(s)?' on':''}" data-a="m-serv" data-s="${s}">${I[SERV[s].i]} ${SERV[s].n}</button>`).join('')}</div>`}

/* ---------- Guardar, deshacer y sincronizar ---------- */
const inflight=new Set();let syncing=false,tm=null;
function put(c,rec){const old=S.data[c][rec.id];rec.updatedAt=Math.max(Date.now(),(old&&old.updatedAt||0)+1);if(!rec.eliminado)rec.eliminado=0;S.data[c][rec.id]=rec;const k=c+':'+rec.id;if(!S.pend.includes(k))S.pend.push(k)}
function afterChange(){save();render();schedule(5000)}
function schedule(ms){clearTimeout(tm);tm=setTimeout(sync,ms)}
function commit(ops,msg){
  const undo=ops.map(o=>({c:o.c,id:o.r.id,prev:S.data[o.c][o.r.id]?Object.assign({},S.data[o.c][o.r.id]):null}));
  for(const o of ops)put(o.c,o.r);
  afterChange();
  toast(msg||'Listo, quedó guardado',()=>{
    for(const u of undo.reverse()){
      const k=u.c+':'+u.id;
      if(u.prev)put(u.c,Object.assign({},u.prev));
      else if(S.pend.includes(k)&&!inflight.has(k)){delete S.data[u.c][u.id];S.pend=S.pend.filter(x=>x!==k)}
      else put(u.c,Object.assign({},S.data[u.c][u.id],{eliminado:1}));
    }
    afterChange();toast('Se deshizo el cambio');
  });
}
function cleanRec(c,r){if(!r)return null;const o={id:r.id,eliminado:Number(r.eliminado)?1:0,updatedAt:r.updatedAt};for(const f of COLS[c])o[f]=NUMF[f]?(r[f]===''||r[f]==null?'':Number(r[f])):String(r[f]==null?'':r[f]);return o}
async function sync(manual){
  if(DEMO){if(manual)toast('En la demostración no hay conexión');return}
  if(!S.conn||syncing)return;
  syncing=true;renderStatus();
  const sent={};const ops=[];
  for(const k of S.pend.slice(0,400)){const i=k.indexOf(':'),c=k.slice(0,i),id=k.slice(i+1);const r=cleanRec(c,S.data[c][id]);if(r){ops.push({col:c,rec:r});sent[k]=r.updatedAt;inflight.add(k)}}
  const cfgSent=S.configDirty;
  const body={action:'push',key:S.conn.k,device:S.device,deviceName:S.deviceName||'Sin nombre',ops};
  if(cfgSent&&isOwner())body.config=cfg();
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),30000);
    const res=await fetch(S.conn.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal,redirect:'follow',credentials:'omit'});
    clearTimeout(to);
    const j=await res.json();
    if(!j.ok){S.status=j.status==='pending'?'pending':'error';S.err=j.error||null;if(j.status==='pending')S.rol=null}
    else{
      const nd={};for(const c in COLS){nd[c]={};for(const r of(j.data&&j.data[c])||[])nd[c][r.id]=r}
      const keep=[];
      for(const k of S.pend){const i=k.indexOf(':'),c=k.slice(0,i),id=k.slice(i+1);const loc=S.data[c][id];
        if(k in sent&&(!loc||loc.updatedAt===sent[k]))continue;
        if(loc){nd[c][id]=loc;keep.push(k)}}
      S.data=nd;S.pend=keep;S.rol=j.rol;
      if(S.configDirty===cfgSent){S.configDirty=0;if(j.config)S.config=j.config}
      S.lastSync=Date.now();S.status='ok';S.err=null;
      if(j.rejected&&j.rejected.length&&manual!==false)toast('Algunos cambios no se permitieron con tu tipo de acceso',null,true);
    }
  }catch(e){S.status='offline'}
  inflight.clear();syncing=false;save();render();
  if(S.status==='ok'&&S.pend.length)schedule(1500);
}

/* ---------- Aviso de guardado ---------- */
let toastT=null;
function toast(msg,undo,bad){
  clearTimeout(toastT);
  $('#toastBox').innerHTML=`<div class="toast${bad?' bad':''}" role="status"><div class="ic">${bad?I.alert:I.check}</div><b>${esc(msg)}</b>${undo?'<button class="btn sm" data-a="undo">Deshacer</button>':''}</div>`;
  window._undo=undo||null;
  toastT=setTimeout(()=>{$('#toastBox').innerHTML='';window._undo=null},undo?4000:2600);
}

/* ---------- Ventanas paso a paso ---------- */
let F=null;
function sheet(html){const w=$('#sheet');w.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';w.hidden=false;w.firstChild.scrollTop=0;const f=w.querySelector('[data-focus]');if(f)setTimeout(()=>{try{f.focus()}catch(e){}},260)}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';F=null}
function shead(q,ctx){return`<div class="shead">${F&&F.hist&&F.hist.length?`<button class="btn sm" data-a="back">${I.back} Regresar</button>`:'<span></span>'}<button class="btn sm" data-a="close">${I.x} Cancelar</button></div><h2 class="q">${q}</h2>${ctx?'<div class="ctx">'+ctx+'</div>':''}`}
function startFlow(name,init){F=Object.assign({flow:name,hist:[],step:'start'},init||{});FLOWS[name].start()}
function go(step){F.hist.push(F.step);F.step=step;FLOWS[F.flow][step]()}
function back(){if(!F||!F.hist.length)return closeSheet();F.step=F.hist.pop();FLOWS[F.flow][F.step]()}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function showErr(msg){const e=$('#ferr');if(e){e.textContent=msg;e.hidden=false}}
function mesOptions(sel,from,to){let h='';for(let i=from;i<=to;i++){const m=addMonths(curMonth(),i);h+=`<option value="${m}"${m===sel?' selected':''}>${mesLargo(m)}</option>`}if(sel&&!h.includes('"'+sel+'"'))h=`<option value="${sel}" selected>${mesLargo(sel)}</option>`+h;return h}
function diaOptions(sel){let h='';for(let d=1;d<=31;d++)h+=`<option value="${d}"${d==sel?' selected':''}>${d}</option>`;return h}
function moneyInp(v){return`<div class="money"><span>$</span><input id="fmonto" inputmode="decimal" autocomplete="off" value="${v===''||v==null?'':esc(v)}" placeholder="0" aria-label="Monto" data-focus></div>`}
function servBadge(s){const sty={gas:'background:var(--lav-l);color:var(--lav)',agua:'background:var(--cielo-l);color:var(--cielo)',internet:'background:#E3F2EF;color:#1F6F63'}[s]||'';return`<span class="chip ${s==='luz'?'warn':'info'}" style="${sty}">${I[SERV[s].i]} ${SERV[s].n}</span>`}
function incSeg(){return`<div class="seg sv">${Object.keys(SERV).map(s=>`<button class="btn sm${F.inc.includes(s)?' on':''}" data-a="pr-inc" data-s="${s}">${I[SERV[s].i]} ${SERV[s].n}</button>`).join('')}</div>`}
function servSeg(){return`<div class="seg sv">${Object.keys(SERV).filter(s=>!(F.incH||[]).includes(s)).map(s=>`<button class="btn sm${F.serv.includes(s)?' on':''}" data-a="pr-serv" data-s="${s}">${I[SERV[s].i]} ${SERV[s].n}</button>`).join('')}</div><p class="hint">Internet: actívalo solo si tú pagas ese recibo. Si el contrato va por aparte, déjalo apagado.</p>`}

const FLOWS={};
/* Gasto */
FLOWS.gasto={
  start(){F.step=F.s&&F.pid?'monto':F.s?'prop':'serv';this[F.step]()},
  serv(){const ss=Object.keys(SERV).filter(s=>recTargets(s).some(t=>!F.pid||t.id===F.pid));if(!ss.length){sheet(shead('No hay recibos por registrar')+'<p class="muted">Ninguna propiedad ni edificio tiene servicios activos. Actívalos al editar la propiedad o el edificio.</p>');return}sheet(shead('¿Qué recibo vas a registrar?')+'<div class="opts">'+ss.map(s=>`<button class="opt ${s}" data-a="g-serv" data-s="${s}"><span class="ic s-${s}">${I[SERV[s].i]}</span><span class="it">${SERV[s].n}</span></button>`).join('')+'</div>')},
  prop(){
    const M=F.mes||curMonth();const ps=recTargets(F.s);
    if(!ps.length){sheet(shead('No hay propiedades con '+SERV[F.s].n)+'<p class="muted">Agrega una propiedad o activa este servicio en sus datos.</p>');return}
    const g=pid=>list('gastos').find(x=>x.propiedadId===pid&&x.servicio===F.s&&x.mes===M);
    ps.sort((a,b)=>(recCubierto(a.id,F.s,M)?1:0)-(recCubierto(b.id,F.s,M)?1:0));
    sheet(shead('¿De qué propiedad?',servBadge(F.s)+`<span class="chip off">${mesLargo(M)}</span>`)+'<div class="opts">'+ps.map(p=>{const x=g(p.id),cu=recCubierto(p.id,F.s,M);return`<button class="opt" data-a="g-prop" data-id="${p.id}"><span class="ic ${cu?'done':'s-'+F.s}">${cu?I.check:I.home}</span><span class="it">${esc(p.nombre)}<span>${x?'Ya anotado: '+money(x.monto)+' · tocar para corregir':cu?'Al corriente ('+FREQ_TXT[F.s]+') · tocar para agregar otro':FREQ[F.s]===0?'Registra cuando llegue el recibo':'Falta registrar'}</span></span></button>`}).join('')+'</div>');
  },
  monto(){
    const M=F.mes||curMonth(),p={nombre:recName(F.pid)};
    const ex=list('gastos').find(x=>x.propiedadId===F.pid&&x.servicio===F.s&&x.mes===M);
    F.exId=ex?ex.id:null;
    const prev=list('gastos').filter(x=>x.propiedadId===F.pid&&x.servicio===F.s&&x.mes<M).sort((a,b)=>a.mes<b.mes?-1:1).slice(-6).map(x=>+x.monto);
    const hint=prev.length>=2?`Lo normal aquí: <b>${money(median(prev))}</b> (según tus últimos ${prev.length} recibos)`:prev.length===1?`El recibo anterior fue de <b>${money(prev[0])}</b>`:'Es el primer recibo de este servicio aquí.';
    sheet(shead('¿Cuánto fue?',servBadge(F.s)+`<span class="chip off">${esc(p.nombre)}</span>`)+moneyInp(ex?ex.monto:'')+`<p class="hint">${hint}</p><div class="err" id="ferr" hidden></div>
      <details class="more"${F.mes&&F.mes!==curMonth()?' open':''}><summary class="btn sm">${I.edit} Cambiar mes o nota</summary>
      <label class="f" for="fmes">Mes del recibo</label><select class="inp" id="fmes">${mesOptions(M,-12,1)}</select>
      <label class="f" for="fnota">Nota (opcional)</label><input class="inp" id="fnota" maxlength="200" value="${esc(ex?ex.nota:'')}"></details>
      <div class="sep"></div><button class="btn pri big full" data-a="g-save">${I.check} Guardar</button>`);
  }
};
/* Pago */
FLOWS.pago={
  start(){F.step=F.tid?'monto':'quien';this[F.step]()},
  quien(){
    const ts=activos().map(t=>({t,st:estadoRenta(t)})).sort((a,b)=>(a.st?a.st.dias:999)-(b.st?b.st.dias:999));
    if(!ts.length){sheet(shead('Aún no hay inquilinos')+'<p class="muted">Registra un inquilino primero.</p>');return}
    sheet(shead('¿Quién pagó?')+'<div class="opts">'+ts.map(({t,st})=>`<button class="opt" data-a="p-quien" data-id="${t.id}"><span class="ic s-pago">${I.cash}</span><span class="it">${esc(t.nombre)}<span>${esc(prop(t.propiedadId).nombre)} · ${money(t.renta)}</span></span>${chipRenta(st)}</button>`).join('')+'</div>');
  },
  monto(){
    const t=get('inquilinos',F.tid),st=estadoRenta(t);const mes=F.mesSel||(st?st.mes:curMonth());
    sheet(shead('¿Cuánto pagó?',`<span class="chip info">${esc(t.nombre)}</span><span class="chip off">${esc(prop(t.propiedadId).nombre)}</span>`)+moneyInp(t.renta)+`<p class="hint">Renta de <b>${mesLargo(mes)}</b> · pagada hoy</p><div class="err" id="ferr" hidden></div>
      <details class="more"><summary class="btn sm">${I.edit} Cambiar mes, fecha o nota</summary>
      <label class="f" for="fmes">¿Qué mes está pagando?</label><select class="inp" id="fmes">${mesOptions(mes,-6,3)}</select>
      <label class="f" for="ffecha">Fecha en que pagó</label><input class="inp" type="date" id="ffecha" value="${today()}">
      <label class="f" for="fnota">Nota (opcional)</label><input class="inp" id="fnota" maxlength="200" placeholder="Ej. transferencia, pagó en efectivo"></details>
      <div class="sep"></div><button class="btn pri big full" data-a="p-save">${I.check} Guardar pago</button>`);
  }
};
/* Pago guardado: confirmar por WhatsApp */
FLOWS.pago.ok=function(){
  const pg=F.pg,t=get('inquilinos',pg.inquilinoId)||{};
  sheet(`<div class="shead"><span></span><button class="btn sm" data-a="close">${I.x} Cerrar</button></div><h2 class="q">Pago guardado</h2><div class="ctx"><span class="chip info">${esc(t.nombre||'')}</span><span class="chip off">${money(pg.monto)} · ${mesLargo(pg.mes)}</span></div>
    ${canWA()?`<label class="f">Recibo para ${esc(firstName(t.nombre))}:</label><div class="waprev">${esc(mensajePago(t,pg))}</div>`:''}
    ${t.telefono?'':'<p class="hint">Este inquilino no tiene WhatsApp registrado.</p>'}
    <div class="sep"></div>${canWA()?`<button class="btn wa big full" data-a="pg-wa" data-id="${pg.id}">${I.chat} Enviar recibo por WhatsApp</button><div class="sep"></div><button class="btn full" data-a="close">Listo, no enviar</button>`:`<p class="hint">El propietario es quien envía la confirmación por WhatsApp.</p><button class="btn pri big full" data-a="close">Listo</button>`}`);
};
/* Alta de inquilino */
FLOWS.alta={
  start(){F.step=F.pid?'datos':'prop';this[F.step]()},
  prop(){
    const ps=propsOrd();
    if(!ps.length){sheet(shead('Primero agrega una propiedad')+`<button class="btn pri big full" data-a="newprop">${I.plus} Agregar propiedad</button>`);return}
    sheet(shead('¿En qué propiedad va a vivir?')+'<div class="opts">'+ps.map(p=>{const t=inqDe(p.id);return`<button class="opt" data-a="a-prop" data-id="${p.id}"><span class="ic s-inq">${I.home}</span><span class="it">${esc(p.nombre)}<span>${t?'Hoy la renta '+esc(t.nombre):'Desocupada'}</span></span>${t?'<span class="chip warn">Ocupada</span>':'<span class="chip ok">Libre</span>'}</button>`}).join('')+'</div>');
  },
  datos(){
    const p=prop(F.pid),d=F.d||{};
    const ini=d.fechaInicio||today();F.dur=F.dur||'12';
    const fin=d.fechaFin||(F.dur!=='otra'?addMesesFecha(ini,Number(F.dur)):'');
    sheet(shead('Datos del inquilino',`<span class="chip off">${esc(p.nombre)}</span>`)+`
      <label class="f" for="fnom">Nombre completo</label><input class="inp" id="fnom" maxlength="80" autocomplete="off" value="${esc(d.nombre||'')}" data-focus>
      <label class="f" for="ftel">WhatsApp (10 dígitos)</label><input class="inp" id="ftel" inputmode="tel" maxlength="16" placeholder="477 123 4567" value="${esc(d.telefono||'')}">
      <div class="two"><div><label class="f" for="fren">Renta al mes</label><input class="inp" id="fren" inputmode="decimal" value="${esc(d.renta!=null?d.renta:(p.renta||''))}"></div>
      <div><label class="f" for="fdia">Paga cada día</label><select class="inp" id="fdia">${diaOptions(d.diaPago||p.diaPago||Number(today().slice(8)))}</select></div></div>
      <div class="box" style="margin-top:16px"><h3>Contrato</h3>
        <label class="f" for="fini">Inicio del contrato</label><input class="inp" type="date" id="fini" value="${esc(ini)}">
        <label class="f">¿Cuánto dura?</label><div class="seg">${[['6','6 meses'],['12','1 año'],['24','2 años'],['otra','Otra fecha']].map(([n,t])=>`<button class="btn sm${F.dur===n?' on':''}" data-a="a-dur" data-n="${n}">${t}</button>`).join('')}</div>
        <label class="f" for="ffin">Termina el</label><input class="inp" type="date" id="ffin" value="${esc(fin)}">
      </div>
      <div class="err" id="ferr" hidden></div>
      <details class="more"><summary class="btn sm">${I.edit} Agregar una nota</summary>
      <label class="f" for="fnota">Nota (opcional)</label><input class="inp" id="fnota" maxlength="300" value="${esc(d.notas||'')}"></details>
      <div class="sep"></div><button class="btn pri big full" data-a="a-next">Continuar</button>`);
  },
  conf(){
    const p=prop(F.pid),old=inqDe(F.pid),d=F.d;
    sheet(shead('¿Registramos a '+esc(firstName(d.nombre))+'?')+`<div class="box"><h3>${esc(d.nombre)}</h3><div class="muted">${esc(p.nombre)} · ${money(d.renta)} al mes · paga el día ${d.diaPago}</div><div class="muted">Contrato: del ${fechaCompleta(d.fechaInicio)} al ${fechaCompleta(d.fechaFin)}</div></div>
      ${old?`<div class="box" style="border-color:var(--oro-b);background:var(--oro-l)"><h3>${I.alert} ${esc(old.nombre)} se dará de baja</h3><div>Hoy aparece como inquilino de ${esc(p.nombre)}. Quedará en el historial con salida el ${fechaLarga(d.fechaInicio)}.</div></div>`:''}
      ${old&&invDe(F.pid,'en').length?`<p class="muted">Antes de registrar al nuevo inquilino, revisa el inventario que entrega ${esc(firstName(old.nombre))}.</p><button class="btn pri big full" data-a="a-chk">${I.list} Continuar: revisar inventario (${invDe(F.pid,'en').length})</button>`:`<button class="btn pri big full" data-a="a-save">${I.check} Sí, registrar</button>`}`);
  },
  chk(){
    const p=prop(F.pid),old=inqDe(F.pid),inv=invDe(F.pid,'en');
    sheet(shead('Revisa lo que entrega '+esc(firstName(old.nombre)),`<span class="chip off">${esc(p.nombre)}</span>${chkProg(inv)}`)+`<p class="muted">Marca cómo está cada cosa. Hay que revisar todo para poder registrar a ${esc(firstName(F.d.nombre))}.</p>`+chkRows(inv)+`<div class="sep"></div><button class="btn pri big full" data-a="a-save">${I.check} Registrar a ${esc(firstName(F.d.nombre))}</button>`);
  }
};
/* Baja */
FLOWS.baja={
  start(){F.step=F.tid?'conf':'quien';this[F.step]()},
  quien(){
    const ts=activos();
    if(!ts.length){sheet(shead('No hay inquilinos activos'));return}
    sheet(shead('¿Quién deja de rentar?')+'<div class="opts">'+ts.map(t=>`<button class="opt" data-a="b-quien" data-id="${t.id}"><span class="ic s-inq">${I.userMinus}</span><span class="it">${esc(t.nombre)}<span>${esc(prop(t.propiedadId).nombre)}</span></span></button>`).join('')+'</div>');
  },
  conf(){
    const t=get('inquilinos',F.tid),inv=invDe(t.propiedadId,'en');
    sheet(shead('¿'+esc(firstName(t.nombre))+' deja '+esc(prop(t.propiedadId).nombre)+'?')+`<p class="muted">La propiedad quedará como desocupada. Sus pagos y datos se quedan en el historial.${inv.length?' Antes de terminar, revisas el inventario de la propiedad.':''}</p>${inv.length?'':'<p class="hint">Esta propiedad no tiene inventario anotado. Puedes agregarlo en Propiedades para revisarlo la próxima vez.</p>'}
      <details class="more"><summary class="btn sm">${I.edit} Cambiar fecha de salida</summary><label class="f" for="ffecha">Fecha de salida</label><input class="inp" type="date" id="ffecha" value="${today()}"></details>
      <div class="sep"></div>${inv.length?`<button class="btn pri big full" data-a="b-next">${I.list} Continuar: revisar inventario (${inv.length})</button>`:`<button class="btn danger big full" data-a="b-save">${I.userMinus} Sí, dar de baja</button>`}`);
  },
  chk(){
    const t=get('inquilinos',F.tid),inv=invDe(t.propiedadId,'en');
    sheet(shead('Revisa el inventario',`<span class="chip off">${esc(prop(t.propiedadId).nombre)}</span>${chkProg(inv)}`)+`<p class="muted">Marca cómo está cada cosa antes de que ${esc(firstName(t.nombre))} entregue. Hay que revisar todo para poder continuar.</p>`+chkRows(inv)+`<div class="sep"></div><button class="btn danger big full" data-a="b-save">${I.userMinus} Dar de baja a ${esc(firstName(t.nombre))}</button>`);
  }
};
/* Propiedad nueva, edificio con departamentos, o edición */
function predialInputs(r){return`<div class="box" style="margin-top:16px"><h3>Predial</h3><label class="f" for="fpre">Monto al año</label><div class="money" style="padding:0 14px"><span style="font-size:26px">$</span><input id="fpre" inputmode="decimal" style="font-size:26px" autocomplete="off" value="${esc(r.predialMonto||'')}" placeholder="0"></div><label class="f" for="fpref">Fecha límite de pago</label><input class="inp" type="date" id="fpref" value="${esc(r.predialFecha||'')}"><label class="f" for="fpreclave">Clave catastral (opcional)</label><input class="inp" id="fpreclave" maxlength="30" value="${esc(r.predialClave||'')}"><p class="hint">Te recuerdo 30 días antes. Si aún no lo sabes, déjalo vacío.</p></div>`}
function leerPredial(){const m=val('fpre'),f=val('fpref');const n=m?num(m):0;if(m&&!(n>=0))return{err:'El monto del predial no es válido.'};if(n>0&&!f)return{err:'Pon también la fecha límite del predial.'};return{predialMonto:m?Math.round(n*100)/100:'',predialFecha:f||'',predialClave:val('fpreclave')}}
function drow(n,t){return`<div class="drow box" style="padding:10px;margin-bottom:8px"><div class="two"><div><label class="f">Número o nombre</label><input class="inp dn" maxlength="20" placeholder="Ej. 1 o 101" value="${esc(n||'')}"></div><div><label class="f">Nota (opcional)</label><input class="inp dt" maxlength="80" placeholder="Ej. Planta alta" value="${esc(t||'')}"></div></div><button class="btn sm" data-a="ed-delrow" style="margin-top:6px;color:var(--rojo)">${I.trash} Quitar</button></div>`}
function leerRows(){return[...document.querySelectorAll('#drows .drow')].map(r=>({n:r.querySelector('.dn').value.trim(),t:r.querySelector('.dt').value.trim()}))}
function parseInts(t){const a=[...new Set(String(t).split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];return a}
FLOWS.prop={
  start(){
    const hered=pid=>{const d=pid?get('predios',pid):null;return String((d&&d.incluidos)||'').split(',').filter(x=>SERV[x])};
    if(F.id){const p=get('propiedades',F.id);F.tipo=p.tipo;F.incH=hered(p.predioId);F.inc=String(p.incluidos||'').split(',').filter(x=>SERV[x]);F.serv=String(p.servicios).split(',').filter(x=>x&&!F.incH.includes(x)&&!F.inc.includes(x));F.step='form';this.form();return}
    F.incH=hered(F.predioId);F.inc=[];F.tipo='Departamento';F.serv=['luz','agua','gas'].filter(x=>!F.incH.includes(x));
    if(F.predioId){F.step='form';this.form();return}
    F.step='tipo';this.tipo();
  },
  tipo(){sheet(shead('¿Qué vas a agregar?')+`<div class="opts"><button class="opt" data-a="pr-modo" data-m="solo"><span class="ic s-inq">${I.home}</span><span class="it">Una casa o un departamento<span>Con su propio recibo y su propia puerta</span></span></button><button class="opt" data-a="pr-modo" data-m="edif"><span class="ic s-inq">${I.key}</span><span class="it">Un edificio con varios departamentos<span>Los registras con su número interior</span></span></button></div>`)},
  form(){
    const p=F.id?get('propiedades',F.id):{};
    const pid=F.predioId||p.predioId||'';const d=pid?get('predios',pid):null;
    const compartido=d&&(d.predialMonto||d.predialFecha);
    let h=shead(F.id?'Datos de la propiedad':(pid?'Nuevo departamento':'Nueva propiedad'),d?`<span class="chip off">${esc(d.nombre)}</span>`:'');
    if(pid){h+=`<label class="f" for="fint">Número o nombre interior</label><input class="inp" id="fint" maxlength="20" placeholder="Ej. 4 o 101" value="${esc(p.interior||'')}" data-focus>`;
      if(F.id)h+=`<label class="f" for="fnom">Nombre en la lista</label><input class="inp" id="fnom" maxlength="60" value="${esc(p.nombre||'')}">`;
      h+=`<label class="f" for="fnota">Nota del departamento (opcional)</label><input class="inp" id="fnota" maxlength="300" placeholder="Ej. Planta alta, entrada por el patio" value="${esc(p.notas||'')}">`}
    else h+=`<label class="f" for="fnom">¿Cómo le dices?</label><input class="inp" id="fnom" maxlength="60" placeholder="Ej. Casa Jardines" value="${esc(p.nombre||'')}" data-focus>`;
    h+=`<label class="f">Tipo</label><div class="seg">${TIPOS.slice(0,3).map(t=>`<button class="btn sm${F.tipo===t?' on':''}" data-a="pr-tipo" data-t="${t}">${t}</button>`).join('')}</div>
      <div class="two"><div><label class="f" for="fren">Renta al mes</label><input class="inp" id="fren" inputmode="decimal" value="${esc(p.renta||'')}"></div>
      <div><label class="f" for="fdia">Día de pago</label><select class="inp" id="fdia">${diaOptions(p.diaPago||1)}</select></div></div>
      ${pid?(F.incH&&F.incH.length?`<p class="hint">Incluido en la renta por el edificio: ${F.incH.map(s=>SERV[s].n.toLowerCase()).join(', ')}. El recibo se registra una sola vez, en el edificio.</p>`:''):`<label class="f">Servicios incluidos en la renta</label><p class="hint">Los pagas tú y ya van en la renta. No se registran recibos.</p>${incSeg()}`}
      <label class="f">${pid?'Servicios que paga el inquilino':'Servicios que paga el inquilino y se registran'}</label>${servSeg()}`;
    if(isOwner())h+=compartido?`<p class="hint">El predial de este edificio se maneja desde el edificio.</p>`:predialInputs(p);
    h+=`<div class="err" id="ferr" hidden></div>
      <details class="more"><summary class="btn sm">${I.edit} Dirección o nota</summary>
      <label class="f" for="fdir">Dirección (opcional)</label><input class="inp" id="fdir" maxlength="120" value="${esc(p.direccion||'')}">
      ${pid?'':`<label class="f" for="fnota">Nota (opcional)</label><input class="inp" id="fnota" maxlength="300" value="${esc(p.notas||'')}">`}</details>
      <div class="sep"></div><button class="btn pri big full" data-a="pr-save">${I.check} Guardar</button>`;
    sheet(h);
  },
  edif1(){const e=F.e||{};sheet(shead('Datos del edificio')+`<label class="f" for="fenom">Nombre del edificio</label><input class="inp" id="fenom" maxlength="50" placeholder="Ej. Edificio Madero" value="${esc(e.nombre||'')}" data-focus><label class="f" for="fedir">Dirección (opcional)</label><input class="inp" id="fedir" maxlength="120" value="${esc(e.direccion||'')}"><div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="ed-1">Continuar</button>`)},
  edif2(){const rows=F.rows&&F.rows.length?F.rows:[{n:'',t:''},{n:'',t:''}];sheet(shead('¿Cuáles son los departamentos?',`<span class="chip off">${esc(F.e.nombre)}</span>`)+`<p class="muted">Un renglón por departamento. Pon su número o nombre y, si quieres, una nota para identificarlo.</p><div id="drows">${rows.map(r=>drow(r.n,r.t)).join('')}</div><button class="btn full" data-a="ed-addrow" style="margin-top:8px">${I.plus} Agregar otro departamento</button><div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="ed-2">Continuar</button>`)},
  edif3(){const e=F.e;sheet(shead('Renta y servicios',`<span class="chip off">${F.list.length} departamento${F.list.length>1?'s':''}</span>`)+`<p class="muted">Valores para empezar. Después puedes cambiarlos en cada departamento.</p><div class="two"><div><label class="f" for="fren">Renta al mes</label><input class="inp" id="fren" inputmode="decimal" value="${esc(e.renta||'')}" data-focus></div><div><label class="f" for="fdia">Día de pago</label><select class="inp" id="fdia">${diaOptions(e.diaPago||1)}</select></div></div><label class="f">Servicios incluidos en la renta</label><p class="hint">Los paga el propietario. El recibo se registra una sola vez, en el edificio (botón «Recibo del edificio»).</p>${incSeg()}<label class="f">Servicios que paga cada inquilino</label>${servSeg()}<div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="ed-3">Continuar</button>`)},
  edif4(){sheet(shead('¿Cómo se paga el predial?')+`<div class="opts"><button class="opt" data-a="pr-pmodo" data-m="edificio"><span class="ic s-inq">${I.home}</span><span class="it">Uno solo por todo el edificio<span>Un solo pago al año</span></span></button><button class="opt" data-a="pr-pmodo" data-m="unidad"><span class="ic s-inq">${I.key}</span><span class="it">Uno por cada departamento<span>Cada uno tiene su cuenta</span></span></button><button class="opt" data-a="pr-pmodo" data-m="no"><span class="ic s-inq">${I.clock}</span><span class="it">Todavía no lo sé<span>Lo agrego después</span></span></button></div>`)},
  pred(){sheet(shead(F.pmodo==='edificio'?'Predial del edificio':'Predial de cada departamento')+(F.pmodo==='unidad'?'<p class="muted">Pongo el mismo monto y fecha a todos. Después puedes ajustar cada uno.</p>':'')+predialInputs(F.pr||{})+`<div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="ed-pred">Continuar</button>`)},
  conf(){const e=F.e,pr=F.pr||{};const pt=F.pmodo==='no'||!pr.predialFecha&&!pr.predialMonto?'Sin predial por ahora':(F.pmodo==='edificio'?'Predial del edificio':'Predial de cada uno')+': '+(pr.predialMonto?money(pr.predialMonto)+' al año':'')+(pr.predialFecha?' · vence el '+fechaCompleta(pr.predialFecha):'');
    sheet(shead('¿Creamos '+esc(e.nombre)+'?')+`<div class="box"><h3>${F.list.length} departamento${F.list.length>1?'s':''}</h3><div class="ps">${F.list.map(x=>`<span class="chip info">${esc(x)}</span>`).join('')}</div><div class="sep" style="height:10px"></div><div class="muted">${e.renta?money(e.renta)+' al mes · ':''}paga el día ${e.diaPago}</div><div class="muted">${esc(pt)}</div></div><button class="btn pri big full" data-a="ed-save">${I.check} Sí, crear</button>`)}
};
FLOWS.predio={
  start(){const d=get('predios',F.id);F.inc=String((d&&d.incluidos)||'').split(',').filter(x=>SERV[x]);F.step='form';this.form()},
  form(){const d=get('predios',F.id);sheet(shead('Datos del edificio')+`<label class="f" for="fenom">Nombre del edificio</label><input class="inp" id="fenom" maxlength="50" value="${esc(d.nombre)}"><label class="f" for="fedir">Dirección (opcional)</label><input class="inp" id="fedir" maxlength="120" value="${esc(d.direccion)}"><label class="f">Servicios incluidos en la renta</label><p class="hint">Los paga el propietario. El recibo se registra una sola vez, en el edificio (botón «Recibo del edificio»).</p>${incSeg()}`+(isOwner()?predialInputs(d):'')+`<div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="pd-save">${I.check} Guardar</button>`)}
};
FLOWS.renov={
  start(){F.step='dur';this.dur()},
  dur(){const t=get('inquilinos',F.tid);sheet(shead('¿Por cuánto tiempo se renueva?',`<span class="chip info">${esc(t.nombre)}</span><span class="chip off">${t.fechaFin?'Termina el '+fechaCompleta(t.fechaFin):'Sin fecha de fin'}</span>`)+'<div class="opts">'+[['6','6 meses'],['12','1 año'],['24','2 años']].map(([n,tx])=>`<button class="opt" data-a="rn-dur" data-n="${n}"><span class="ic s-inq">${I.refresh}</span><span class="it">${tx}</span></button>`).join('')+`<button class="opt" data-a="rn-otra"><span class="ic s-inq">${I.edit}</span><span class="it">Otra fecha</span></button></div>`)},
  otra(){sheet(shead('¿Hasta cuándo?')+`<label class="f" for="ffin">Nueva fecha de fin</label><input class="inp" type="date" id="ffin" data-focus><div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="rn-ok">${I.check} Guardar</button>`)}
};
/* Comentario sobre un cambio */
FLOWS.coment={
  start(){F.step='form';this.form()},
  form(){
    const ex=list('comentarios').find(c=>c.clave===F.clave);
    sheet(shead('¿Qué pasó aquí?',F.ctx)+`<textarea class="inp" id="ftxt" maxlength="500" placeholder="Ej. Subió porque instalaron un minisplit" data-focus>${esc(ex?ex.texto:'')}</textarea>
      <div class="err" id="ferr" hidden></div><div class="sep"></div><button class="btn pri big full" data-a="c-save">${I.check} Guardar comentario</button>`);
  }
};
/* Mantenimientos */
FLOWS.mant={
  start(){
    if(F.id){const m=get('mantenimientos',F.id);if(!m)return closeSheet();F.destino=m.destino;F.msv=mantSv(m);F.step='det';this.det();return}

  det(){

    const fila=(t,fin)=>{const ya=!fin&&av.includes(t.id);return`<div class="tn"><span class="it"><b>${esc(t.nombre)}</b><span>${esc((prop(t.propiedadId)||{}).nombre||'')}${ya?' · ya avisado':''}</span></span><button class="btn sm wa" data-a="${fin?'m-wafin':'m-wa'}" data-id="${t.id}">${I.chat} ${ya?'Reenviar':'Avisar'}</button></div>`};

    const paso=hecho?['okk',I.check,'Terminado. Si quieres, avisa a los inquilinos que ya quedó.']:!ts.length?['',2,'No hay inquilinos que avisar. Cuando terminen, toca «Ya se terminó».']:nAv<ts.length?['',1,'Siguiente paso: avisa a los inquilinos'+(ts.length>1?' ('+nAv+' de '+ts.length+' avisados).':'.')]:['okk',2,'Todos avisados. Cuando terminen el trabajo, toca «Ya se terminó».'];

    h+=`<div class="box"><h3>Avisar a los inquilinos</h3>`+(ts.length?`<p class="muted small">Se abre WhatsApp con el mensaje listo; tú solo das enviar, uno por uno.</p><div class="waprev">${esc(mensajeMant(ts[0],m,false))}</div>`+ts.map(t=>fila(t,false)).join(''):'<p class="muted">Ahora no hay inquilinos en este lugar.</p>')+'</div>';
    if(hecho&&ts.length)h+=`<div class="box"><h3>Avisar que ya terminó</h3>`+ts.map(t=>fila(t,true)).join('')+'</div>';

    sheet(h);

/* ---------- Acciones ---------- */
function parseMonto(){const n=num(val('fmonto'));if(!(n>0)||n>10000000){showErr('Escribe una cantidad válida.');return null}return Math.round(n*100)/100}
function abrirWA(t,etapa,registrar){
  if(!canWA())return;
  const tel=telWa(t.telefono);
  if(!tel){toast('Falta el WhatsApp de '+firstName(t.nombre)+'. Agrégalo en Historial o Propiedades.',null,true);return}
  const st=estadoRenta(t);
  window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(mensaje(t,st,etapa)),'_blank','noopener');
  if(registrar&&st&&etapa)commit([{c:'avisos',r:{id:uid(),inquilinoId:t.id,mes:st.mes,etapa,fecha:today()}}],'Aviso registrado como enviado');
}
const ACT={
  close:closeSheet,back,

  gasto(d){startFlow('gasto',Object.assign(d.s?{s:d.s}:{},d.id?{pid:d.id}:{}))},

  'dp-ok'(){const p=prop(F.id);closeSheet();commit([{c:'propiedades',r:Object.assign({},p,{eliminado:1})}],'Propiedad borrada')},
  'g-serv'(d){F.s=d.s;go(F.pid?'monto':'prop')},
  'g-prop'(d){F.pid=d.id;go('monto')},
  'g-save'(){const m=parseMonto();if(m==null)return;const mes=val('fmes')||curMonth();
    const ex=list('gastos').find(x=>x.propiedadId===F.pid&&x.servicio===F.s&&x.mes===mes);

    closeSheet();commit([{c:'gastos',r}],'Listo, quedó guardado')},
  'p-quien'(d){F.tid=d.id;go('monto')},
  'p-save'(){const m=parseMonto();if(m==null)return;const t=get('inquilinos',F.tid);const st=estadoRenta(t);
    const r={id:uid(),inquilinoId:t.id,propiedadId:t.propiedadId,mes:val('fmes')||(st?st.mes:curMonth()),fecha:val('ffecha')||today(),monto:m,nota:val('fnota')};
    commit([{c:'pagos',r}],'Pago de '+firstName(t.nombre)+' guardado');F={flow:'pago',hist:[],tid:t.id,pg:r,step:'ok'};FLOWS.pago.ok()},
  'a-prop'(d){F.pid=d.id;go('datos')},
  'a-dur'(d,b){F.dur=d.n;document.querySelectorAll('[data-a="a-dur"]').forEach(x=>x.classList.toggle('on',x===b));const e=document.getElementById('ffin');if(!e)return;if(d.n!=='otra')e.value=addMesesFecha(val('fini')||today(),Number(d.n));else e.focus()},
  'a-next'(){const nombre=val('fnom'),tel=val('ftel').replace(/\D/g,''),renta=num(val('fren'));
    if(nombre.length<2)return showErr('Escribe el nombre del inquilino.');
    if(tel&&!telWa(tel))return showErr('El WhatsApp debe tener 10 dígitos.');
    if(!(renta>0))return showErr('Escribe la renta mensual.');

    if(!fin)return showErr('Pon la fecha en que termina el contrato.');

  'rn-ok'(){const f=val('ffin');if(!f)return showErr('Elige la fecha.');if(f<=today())return showErr('La fecha debe ser futura.');const t=get('inquilinos',F.tid);closeSheet();commit([{c:'inquilinos',r:Object.assign({},t,{fechaFin:f})}],'Contrato renovado hasta el '+fechaLarga(f))},
  'pred-pag'(d){const r=get(d.c,d.id);if(!r)return;const nueva=addYear(r.predialFecha);closeSheet();commit([{c:d.c,r:Object.assign({},r,{predialFecha:nueva,predialPagado:today()})}],'Predial anotado. Próximo vencimiento: '+fechaCompleta(nueva))},
  editpredio(d){startFlow('predio',{id:d.id})},
  addunit(d){startFlow('prop',{predioId:d.id})},
  'pd-save'(){const nombre=val('fenom');if(nombre.length<2)return showErr('Escribe el nombre del edificio.');const x=isOwner()?leerPredial():{};if(x.err)return showErr(x.err);const r=Object.assign({},get('predios',F.id),{nombre,direccion:val('fedir'),incluidos:Object.keys(SERV).filter(s=>F.inc.includes(s)).join(',')},x);closeSheet();commit([{c:'predios',r}],'Edificio guardado')},
  bld(d,b){if(OPENB.has(d.id))OPENB.delete(d.id);else OPENB.add(d.id);const w=b.closest('.bld');const o=OPENB.has(d.id);w.classList.toggle('open',o);w.querySelector('.bbody').hidden=!o;b.setAttribute('aria-expanded',o)},

let TAB='inicio',HF='todo',HP='todo',HV='',HPR='todo',HOPEN=false,HLIM=60,RMES=addMonths(curMonth(),0);
function renderStatus(){
  const el=$('#status');if(!el)return;
  let cls='',txt='',btn='';
  if(DEMO){cls='warn';txt='Demostración: los cambios no se guardan'}
  else if(!S.conn){cls='off';txt='Este teléfono aún no está conectado';btn=`<button class="btn sm" data-a="ajustes">Conectar</button>`}
  else if(syncing){cls='warn';txt='Guardando…'}
  else if(S.status==='pending'){cls='warn';txt='Esperando que el propietario apruebe este teléfono';btn=`<button class="btn sm" data-a="sync">${I.refresh} Revisar</button>`}
  else if(S.status==='error'){cls='bad';txt={clave:'La clave no es correcta',bloqueado:'Demasiados intentos. Espera 15 minutos',sinclave:'La hoja aún no tiene clave',muchos:'Hay demasiados teléfonos esperando aprobación'}[S.err]||'Algo falló al guardar';btn=`<button class="btn sm" data-a="sync">${I.refresh} Revisar</button>`}
  else if(S.status==='offline'){cls='bad';txt=S.pend.length?'Sin internet. Se guarda cuando regrese':'Sin internet';btn=`<button class="btn sm" data-a="sync">${I.refresh} Revisar</button>`}
  else if(S.pend.length){cls='warn';txt='Guardando…'}
  else if(S.lastSync&&S.status==='ok'){txt='Todo guardado'}
  else{cls='warn';txt='Conectando…'}
  el.innerHTML=`<span class="dot ${cls}"></span><span>${txt}</span>${btn}`;
}

function tuDia(){
  const items=[],M=curMonth(),hoy=today();
  for(const t of (canWA()?activos():[])){const st=estadoRenta(t);if(!st||!st.etapa)continue;const av=avisoDe(t,st);items.push({k:'aviso',t,st,done:!!av,av})}
  for(const t of activos()){if(!t.fechaFin)continue;const dias=dayDiff(hoy,t.fechaFin);if(dias<=60)items.push({k:'contrato',t,dias,done:false})}
  if(isOwner()){
    const addP=(c,r)=>{if(!r.predialFecha)return;const dias=dayDiff(hoy,r.predialFecha);if(dias<=30)items.push({k:'predial',c,r,n:r.nombre,dias,done:false})};
    list('predios').forEach(r=>addP('predios',r));list('propiedades').forEach(r=>addP('propiedades',r));
  }
  for(const m of list('mantenimientos')){if(m.estado==='hecho')continue;const dias=dayDiff(hoy,m.fecha);if(dias<=3)items.push({k:'mant',m,dias,done:false})}
  const props=list('propiedades'),gs=list('gastos');
  for(const s of Object.keys(SERV)){if(!FREQ[s])continue;const ps=recTargets(s);if(!ps.length)continue;const n=ps.filter(p=>recCubierto(p.id,s,M)).length;items.push({k:'recibo',s,n,total:ps.length,done:n===ps.length})}
  const dg=x=>x.k==='aviso'?x.st.dias:x.dias!=null?x.dias:500;items.sort((a,b)=>(a.done-b.done)||(dg(a)-dg(b)));
  return items;
}
function diaSheet(keep){
